name: Daily PCS Scan

on:
  schedule:
    # 13:30 UTC weekdays = 5:30 AM PT / 8:30 AM ET — after prior session EOD is settled.
    # Cron in GitHub Actions runs in UTC, not local time, so DST does not shift this.
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to commit data.json back to main

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scan
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: npm run fetch

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: scan $(date -u +%Y-%m-%d)"
            git push
          fi
